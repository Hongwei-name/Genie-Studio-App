name: genie_review_assistant
description: "智元标注审核助手桌面端 - 解决并发能力不足及功能弱的问题"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络请求
  dio: ^5.7.0

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.7

  # 本地存储
  shared_preferences: ^2.3.2

  # 打开系统浏览器
  url_launcher: ^6.3.1

  # Windows WebView（应用内打开EP审核页）
  webview_windows: ^0.4.0

  # 窗口管理（交通灯按钮）
  window_manager: ^0.4.2

  # 国际化与时间格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
