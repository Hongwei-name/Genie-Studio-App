name: genie_review_assistant
description: "智元标注审核助手桌面端 - 解决并发能力不足及功能弱的问题"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_windows: ^0.4.0
  window_manager: ^0.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true

# MSIX 打包配置
msix_config:
  display_name: 智元标注审核助手
  publisher_display_name: GenieStudio
  identity_name: com.geniestudio.reviewassistant
  msix_version: 1.0.0.0
  logo_path: windows\runner\resources\app_icon.ico
  capabilities: internetClient
  languages: zh-cn
  file_extension:
    - .json
  execution_alias: genie-review
  install_certificate: false
  sign_msix: false
