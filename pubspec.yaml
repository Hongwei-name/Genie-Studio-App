name: zero_k_genie
description: "zero_K-Genie 智元标注审核助手桌面端 - 解决并发能力不足及功能弱的问题"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_windows: ^0.4.0
  window_manager: ^0.4.2
  system_tray: ^2.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true

msix_config:
  display_name: 智元标注审核助手
  publisher_display_name: zero_K
  identity_name: com.zerok.genie
  publisher: CN=zero_K
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  languages: zh-CN




